services:
  db:
    image: postgres:18-alpine
    container_name: marketing-copilot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketing_copilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marketing_copilot_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketing_copilot_data: